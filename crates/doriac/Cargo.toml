[package]
name = "doriac"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
default-run = "doriac"

[lib]
name = "doriac"
path = "src/lib.rs"

[features]
default = ["bundled-runtime"]
bundled-runtime = []
llvm-backend = ["dep:inkwell"]

[dependencies]
cranelift-codegen = "0.134.2"
cranelift-frontend = "0.134.2"
cranelift-module = "0.134.2"
cranelift-native = "0.134.2"
cranelift-object = "0.134.2"
inkwell = { version = "=0.9.0", features = ["llvm18-1-prefer-dynamic"], optional = true }
doria-unicode = { path = "../doria-unicode" }
serde_json = "1"
unicode-width = "0.2"
ryu.workspace = true

[build-dependencies]
doria-unicode = { path = "../doria-unicode" }
ryu.workspace = true

[dev-dependencies]
doria-rt = { path = "../doria-rt", default-features = false }

[[bin]]
name = "doriac"
path = "src/main.rs"
