[package]
name = "doriac"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
default-run = "doriac"

[lib]
name = "doriac"
path = "src/lib.rs"

[features]
default = ["bundled-runtime"]
bundled-runtime = []
llvm-backend = ["dep:inkwell"]

[dependencies]
doria-diagnostic-catalogue = { path = "../doria-diagnostic-catalogue" }
cranelift-codegen = "0.134.2"
cranelift-frontend = "0.134.2"
cranelift-module = "0.134.2"
cranelift-native = "0.134.2"
cranelift-object = "0.134.2"
inkwell = { version = "=0.10.0", features = ["llvm18-1-prefer-dynamic"], optional = true }
doria-unicode = { path = "../doria-unicode" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
unicode-width = "0.2"
ryu.workspace = true

# There are deliberately no `[build-dependencies]`. build.rs used to declare the
# runtime's dependencies here so they would be "ready" before it ran, but cargo
# builds build-dependencies as host units under the build-override profile
# (`opt-level=0`, `panic=unwind`). That ordered the wrong copies while leaving a
# second, correct copy of each crate beside them, which is what made the
# runtime's dependency selection ambiguous. build.rs now asks cargo to build
# `doria-rt` from its own manifest instead.

[dev-dependencies]
doria-rt = { path = "../doria-rt", default-features = false }

[[bin]]
name = "doriac"
path = "src/main.rs"
