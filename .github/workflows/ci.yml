name: ci

on:
  push:
    branches: [develop,main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  parser-fuzz:
    name: parser-fuzz
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Install pinned cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.1 --locked

      - name: Run bounded parser fuzzing
        run: cargo +nightly fuzz run parser fuzz/corpus/parser -- -max_total_time=30 -timeout=2 -max_len=4096

      - name: Preserve parser fuzz artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: parser-fuzz-artifacts
          path: fuzz/artifacts/parser
          if-no-files-found: ignore

  rust:
    name: rust
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install native leak checker
        run: |
          sudo apt-get update
          sudo apt-get install --yes valgrind

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build
        run: cargo build --workspace --all-targets --locked --verbose

      - name: Build doria-rt static library
        run: cargo build -p doria-rt --locked --verbose

      - name: Check host linker for native parity
        run: cc --version

      - name: Test
        run: cargo test --workspace --all-targets --locked --verbose

      - name: Run focused Stage 13 integer engine and semantic tests
        run: |
          cargo test -p doriac --test integer_engine_tests --locked --verbose
          cargo test -p doriac --test stage13_semantic_tests --locked --verbose

      - name: Run focused Stage 14 float engine, semantic, and interpreter tests
        run: |
          cargo test -p doriac --test float_engine_tests --locked --verbose
          cargo test -p doriac --test stage14_semantic_tests --locked --verbose
          cargo test -p doriac --test stage14_mir_interpreter_tests --locked --verbose

      - name: Run focused Stage 16 runtime string tests
        run: |
          cargo test -p doria-rt --locked --verbose
          cargo test -p doriac --test stage16_runtime_string_tests --locked --verbose

      - name: Run focused Stage 17 I/O, format, nullable-flow, and MIR validation tests
        run: |
          cargo test -p doria-rt --locked --verbose
          cargo test -p doriac --test stage17_io_tests --locked --verbose
          cargo test -p doriac --test mir_validation_tests --locked --verbose
          cargo test -p doriac --test cranelift_mir_tests --locked --verbose

      - name: Run focused Stage 18 parser, semantic, and diagnostic tests
        run: |
          cargo test -p doriac --test parser_tests --locked --verbose
          cargo test -p doriac --test semantic_tests --locked --verbose
          cargo test -p doriac --test stage18_tests --locked --verbose

      - name: Run focused MIR and linker-independent Cranelift tests
        run: |
          cargo test -p doriac --test mir_tests --locked --verbose
          cargo test -p doriac --test cranelift_mir_tests --locked --verbose

      - name: Run complete durable interpreter and Cranelift parity matrix
        run: cargo test -p doriac --test native_mir_parity_tests --locked --verbose

      - name: Leak-check Stage 16 Cranelift runtime strings
        run: |
          cargo run -p doriac -- compile examples/native/main_runtime_string_builder.doria --out build/native/main_runtime_string_builder
          valgrind --leak-check=full --show-leak-kinds=all --errors-for-leak-kinds=definite,indirect --error-exitcode=1 build/native/main_runtime_string_builder

      - name: Leak-check Stage 17 Cranelift I/O and formatting
        run: |
          cargo run -p doriac -- compile examples/native/main_stage17_io_stress.doria --out build/native/main_stage17_io_stress
          work="$(mktemp -d)"
          cp crates/doriac/tests/fixtures/native_io/main_stage17_io_stress/files/seed.txt "$work/seed.txt"
          cp build/native/main_stage17_io_stress "$work/program"
          (cd "$work" && valgrind --leak-check=full --show-leak-kinds=all --errors-for-leak-kinds=definite,indirect --error-exitcode=1 ./program < "$GITHUB_WORKSPACE/crates/doriac/tests/fixtures/native_io/main_stage17_io_stress/stdin")
          rm -rf "$work"

      - name: Leak-check Stage 19-21 Cranelift class ownership and method paths
        run: |
          for name in main_stage19_destructor_order main_stage19_initialization_order main_stage19_raii_guard main_stage19_playground_message main_stage20_parser main_stage20_displayable main_stage20_method_ownership main_stage20_static_constructor main_stage20_self main_stage20b_const_string_defaults main_stage21_conditional_constructor; do
            cargo run -p doriac -- compile "examples/native/${name}.doria" --out "build/native/${name}"
            valgrind --leak-check=full --show-leak-kinds=all --errors-for-leak-kinds=definite,indirect --track-origins=yes --error-exitcode=1 "build/native/${name}"
          done

      - name: Leak-check Stage 23a reordered owned arguments with Cranelift
        run: |
          cargo run -p doriac -- compile examples/native/main_stage23a_named_owned_arguments.doria --out build/native/main_stage23a_named_owned_arguments
          valgrind --leak-check=full --show-leak-kinds=all --errors-for-leak-kinds=definite,indirect --track-origins=yes --error-exitcode=1 build/native/main_stage23a_named_owned_arguments

      - name: Leak-check Stage 23c string sequence fills with Cranelift
        run: |
          cargo run -p doriac -- compile examples/native/main_stage23c_sequence_fill.doria --out build/native/main_stage23c_sequence_fill
          valgrind --leak-check=full --show-leak-kinds=all --errors-for-leak-kinds=definite,indirect --track-origins=yes --error-exitcode=1 build/native/main_stage23c_sequence_fill

      - name: Leak-check Stage 24 generic specialization with Cranelift
        run: |
          cargo run -p doriac -- compile examples/native/main_stage24_generic_first.doria --out build/native/main_stage24_generic_first
          valgrind --leak-check=full --show-leak-kinds=all --errors-for-leak-kinds=definite,indirect --track-origins=yes --error-exitcode=1 build/native/main_stage24_generic_first

      - name: Leak-check Stage 25 generic classes with Cranelift
        run: |
          cargo run -p doriac -- compile examples/native/main_stage25_generic_classes.doria --out build/native/main_stage25_generic_classes
          valgrind --leak-check=full --show-leak-kinds=all --errors-for-leak-kinds=definite,indirect --track-origins=yes --error-exitcode=1 build/native/main_stage25_generic_classes

      - name: Leak-check Stage 25a readonly shared ownership with Cranelift
        run: |
          cargo run -p doriac -- compile examples/native/main_stage25a_readonly_shared_ownership.doria --out build/native/main_stage25a_readonly_shared_ownership
          valgrind --leak-check=full --show-leak-kinds=all --errors-for-leak-kinds=definite,indirect --track-origins=yes --error-exitcode=1 build/native/main_stage25a_readonly_shared_ownership
          cargo run -p doriac -- compile examples/native/main_stage25a_shared_coalesce_ownership.doria --out build/native/main_stage25a_shared_coalesce_ownership
          valgrind --leak-check=full --show-leak-kinds=all --errors-for-leak-kinds=definite,indirect --track-origins=yes --error-exitcode=1 build/native/main_stage25a_shared_coalesce_ownership
          cargo run -p doriac -- compile examples/native/main_stage25a_referenced_value_collision.doria --out build/native/main_stage25a_referenced_value_collision
          valgrind --leak-check=full --show-leak-kinds=all --errors-for-leak-kinds=definite,indirect --track-origins=yes --error-exitcode=1 build/native/main_stage25a_referenced_value_collision

      - name: Leak-check Stage 25a writable shared ownership with Cranelift
        run: |
          for name in main_stage25a_writable_shared_class main_stage25a_writable_shared_collection main_stage25a_writable_shared_domains main_stage25a_writable_weak_reference main_stage25a_weak_cycle main_stage25a_shared_stress main_stage25a_access_lifetime main_stage25a_stored_access; do
            cargo run -p doriac -- compile "examples/native/${name}.doria" --out "build/native/${name}"
            valgrind --leak-check=full --show-leak-kinds=all --errors-for-leak-kinds=definite,indirect --track-origins=yes --error-exitcode=1 "build/native/${name}"
          done

      - name: Leak-check Stage 26a grouped string locals with Cranelift
        run: |
          cargo run -p doriac -- compile examples/native/main_stage26a_grouped_locals.doria --out build/native/main_stage26a_grouped_locals
          valgrind --leak-check=full --show-leak-kinds=all --errors-for-leak-kinds=definite,indirect --track-origins=yes --error-exitcode=1 build/native/main_stage26a_grouped_locals

      - name: Leak-check Stage 27 payload enum ownership with Cranelift
        run: |
          for name in main_payload_enums_copy main_payload_enums_drop_order; do
            cargo run -p doriac -- compile "examples/native/${name}.doria" --out "build/native/${name}"
            valgrind --leak-check=full --show-leak-kinds=all --errors-for-leak-kinds=definite,indirect --track-origins=yes --error-exitcode=1 "build/native/${name}"
          done

      - name: Smoke signed and unsigned narrow-width native fixtures
        run: |
          cargo run -p doriac -- compile examples/native/main_integer_div_mod_42.doria --target native --out build/native/main_integer_div_mod_42
          cargo run -p doriac -- compile examples/native/main_fixed_width_arithmetic_42.doria --target native --out build/native/main_fixed_width_arithmetic_42
          set +e
          build/native/main_integer_div_mod_42
          signed_status=$?
          build/native/main_fixed_width_arithmetic_42
          unsigned_status=$?
          set -e
          test "${signed_status}" -eq 42
          test "${unsigned_status}" -eq 42

      - name: Smoke Stage 14 native scalar and panic fixtures
        run: |
          cargo run -p doriac -- compile examples/native/main_float32_rounding_42.doria --target native --out build/native/main_float32_rounding_42
          cargo run -p doriac -- compile examples/native/main_float64_arithmetic_42.doria --target native --out build/native/main_float64_arithmetic_42
          cargo run -p doriac -- compile examples/native/main_bool_short_circuit_42.doria --target native --out build/native/main_bool_short_circuit_42
          cargo run -p doriac -- compile examples/native/main_float_to_int_nan_panic.doria --target native --out build/native/main_float_to_int_nan_panic
          set +e
          build/native/main_float32_rounding_42
          float32_status=$?
          build/native/main_float64_arithmetic_42
          float64_status=$?
          build/native/main_bool_short_circuit_42
          bool_status=$?
          build/native/main_float_to_int_nan_panic 2>build/native/main_float_to_int_nan_panic.stderr
          panic_status=$?
          set -e
          test "${float32_status}" -eq 42
          test "${float64_status}" -eq 42
          test "${bool_status}" -eq 42
          test "${panic_status}" -eq 101
          grep -Fx "Panic[P1110]: Float To Integer Conversion Is Out Of Range" build/native/main_float_to_int_nan_panic.stderr
          grep -Fx "Call Path" build/native/main_float_to_int_nan_panic.stderr

      - name: Check repository script guardrails
        run: |
          if find scripts -type f -name '*.py' -print -quit | grep -q .; then
            echo "Do not add Python scripts under scripts/; use Rust/PHP or update this guardrail with the explicit reason."
            find scripts -type f -name '*.py' -print
            exit 1
          fi

      - name: Check documentation authority
        run: |
          php scripts/check_docs_authority.php
          php scripts/check_stage25a_completion.php
          php scripts/check_checked_error_foundation.php
          php scripts/check_stage29_completion.php
          php scripts/check_stage30f_php_closure_compatibility.php
          php scripts/check_stage30g_list_algorithms.php
          php scripts/check_stage30h_closure_completion.php

      # Reachability needs the network and, for private repositories, an
      # explicitly scoped credential. Structural checks always run. A configured
      # credential makes remote verification mandatory; otherwise the checker
      # reports UNVERIFIED without pretending that reachability was proved.
      - name: Check cross-repository revision pins
        env:
          GH_TOKEN: ${{ secrets.DORIA_CROSS_REPO_TOKEN }}
        run: |
          php scripts/test_cross_repo_pins.php
          if [ -n "${GH_TOKEN}" ]; then
            php scripts/check_cross_repo_pins.php --require-remote
          else
            echo "::warning::Cross-repository reachability is unverified because DORIA_CROSS_REPO_TOKEN is not configured"
            php scripts/check_cross_repo_pins.php
          fi

      - name: Check diagnostic and runtime-outcome architecture
        run: |
          php scripts/check_diagnostic_style.php
          php scripts/check_panic_catalogue.php
          php scripts/check_runtime_diagnostic_architecture.php

      - name: Smoke check native Doria example
        run: cargo run -p doriac -- check examples/native/main_if_42.doria

      - name: Smoke dump native Doria example IR
        run: cargo run -p doriac -- hir examples/native/main_if_42.doria

      - name: Smoke compile native Doria example with default target
        run: cargo run -p doriac -- compile examples/native/main_if_42.doria --out build/native/main_if_42

      - name: Smoke run native Doria executable
        run: |
          set +e
          build/native/main_if_42
          status=$?
          set -e
          echo "native exit code: ${status}"
          test "${status}" -eq 42

      - name: Smoke check PHP compatibility example
        run: cargo run -p doriac -- check examples/php/person.doria

      - name: Smoke compile PHP compatibility example
        run: cargo run -p doriac -- compile examples/php/person.doria --target php --out build/php/person.php

  llvm-release:
    name: llvm-release-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      DORIA_LLVM_VERSION: 18

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Configure MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Select the MSVC linker
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $linker = (Get-Command link.exe -ErrorAction Stop).Source
          if ($linker -notmatch '\\VC\\Tools\\MSVC\\') {
            throw "expected the MSVC linker after developer environment setup, found: $linker"
          }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install LLVM 18 on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes llvm-18-dev libffi-dev valgrind
          echo "LLVM_SYS_181_PREFIX=/usr/lib/llvm-18" >> "$GITHUB_ENV"

      - name: Install LLVM 18.1.8 on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install llvm@18
          llvm_prefix="$(brew --prefix llvm@18)"
          echo "LLVM_SYS_181_PREFIX=${llvm_prefix}" >> "$GITHUB_ENV"
          echo "DYLD_FALLBACK_LIBRARY_PATH=${llvm_prefix}/lib" >> "$GITHUB_ENV"
          echo "${llvm_prefix}/bin" >> "$GITHUB_PATH"

      - name: Install LLVM 18.1.8 development archive on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $uri = "https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/clang%2Bllvm-18.1.8-x86_64-pc-windows-msvc.tar.xz"
          $archive = Join-Path $env:RUNNER_TEMP "clang+llvm-18.1.8-x86_64-pc-windows-msvc.tar.xz"
          $prefix = Join-Path $env:RUNNER_TEMP "clang+llvm-18.1.8-x86_64-pc-windows-msvc"
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            Remove-Item $archive -Force -ErrorAction SilentlyContinue
            try {
              Invoke-WebRequest -Uri $uri -OutFile $archive
              if ((Get-Item $archive).Length -eq 0) { throw "downloaded archive is empty" }
              tar -tf $archive | Out-Null
              if ($LASTEXITCODE -ne 0) { throw "downloaded archive failed its integrity check" }
              break
            } catch {
              if ($attempt -eq 5) {
                throw "failed to download a valid LLVM archive after $attempt attempts: $($_.Exception.Message)"
              }
              Write-Warning ("LLVM download attempt {0} failed: {1}" -f $attempt, $_.Exception.Message)
              Start-Sleep -Seconds (5 * $attempt)
            }
          }
          Remove-Item $prefix -Recurse -Force -ErrorAction SilentlyContinue
          tar -xf $archive -C $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw "failed to extract the LLVM archive" }
          if (-not (Test-Path (Join-Path $prefix "bin\llvm-config.exe"))) {
            throw "LLVM archive did not contain the expected llvm-config.exe"
          }
          $vcpkg = (Get-Command vcpkg -ErrorAction Stop).Source
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            & $vcpkg install "libxml2[core]:x64-windows-static"
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) { throw "failed to install LLVM's static libxml2 dependency after $attempt attempts" }
            Start-Sleep -Seconds (5 * $attempt)
          }
          $libxmlDirectory = Join-Path (Split-Path $vcpkg) "installed\x64-windows-static\lib"
          $libxml = Join-Path $libxmlDirectory "libxml2s.lib"
          if (-not (Test-Path $libxml)) { $libxml = Join-Path $libxmlDirectory "libxml2.lib" }
          if (-not (Test-Path $libxml)) { throw "vcpkg did not provide a static libxml2 library in $libxmlDirectory" }
          Copy-Item $libxml (Join-Path $prefix "lib\libxml2s.lib")
          "LLVM_SYS_181_PREFIX=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RUSTFLAGS=-l bcrypt" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $prefix "bin") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Confirm pinned LLVM major on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: "${LLVM_SYS_181_PREFIX}/bin/llvm-config --version"

      - name: Confirm pinned LLVM major on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:LLVM_SYS_181_PREFIX\bin\llvm-config.exe" --version
          cl.exe /? | Out-Null

      - name: Build optimized doria-rt and select it explicitly
        shell: bash
        run: |
          cargo build -p doria-rt --release --locked --verbose
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            echo "DORIA_RT_PATH=${GITHUB_WORKSPACE}/target/release/doria_rt.lib" >> "$GITHUB_ENV"
          else
            echo "DORIA_RT_PATH=${GITHUB_WORKSPACE}/target/release/libdoria_rt.a" >> "$GITHUB_ENV"
          fi

      - name: Run tier-1 Stage 17 runtime I/O tests
        run: cargo test -p doria-rt --release --locked --verbose

      - name: Clippy LLVM-enabled compiler
        run: cargo clippy -p doriac --all-targets --features llvm-backend --locked -- -D warnings

      - name: Build LLVM-enabled compiler
        run: cargo build -p doriac --all-targets --features llvm-backend --locked --verbose

      - name: Run shared validator and LLVM-focused tests
        run: |
          cargo test -p doriac --test mir_validation_tests --features llvm-backend --locked --verbose
          cargo test -p doriac --test llvm_mir_tests --features llvm-backend --locked --verbose
          cargo test -p doriac --test cli_tests --features llvm-backend --locked --verbose
          cargo test -p doriac --test stage17_io_tests --features llvm-backend --locked --verbose
          cargo test -p doriac --test stage18_tests --features llvm-backend --locked --verbose

      - name: Run complete interpreter, Cranelift, and LLVM parity manifest
        run: cargo test -p doriac --test native_mir_parity_tests --features llvm-backend --locked --verbose

      - name: Leak-check Stage 16 LLVM runtime strings
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo run -p doriac --features llvm-backend -- compile examples/native/main_runtime_string_builder.doria --release --out build/native/main_runtime_string_builder_release
          valgrind --leak-check=full --show-leak-kinds=all --errors-for-leak-kinds=definite,indirect --error-exitcode=1 build/native/main_runtime_string_builder_release

      - name: Leak-check Stage 17 LLVM I/O and formatting
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo run -p doriac --features llvm-backend -- compile examples/native/main_stage17_io_stress.doria --release --out build/native/main_stage17_io_stress_release
          work="$(mktemp -d)"
          cp crates/doriac/tests/fixtures/native_io/main_stage17_io_stress/files/seed.txt "$work/seed.txt"
          cp build/native/main_stage17_io_stress_release "$work/program"
          (cd "$work" && valgrind --leak-check=full --show-leak-kinds=all --errors-for-leak-kinds=definite,indirect --error-exitcode=1 ./program < "$GITHUB_WORKSPACE/crates/doriac/tests/fixtures/native_io/main_stage17_io_stress/stdin")
          rm -rf "$work"

      - name: Leak-check Stage 19-21 LLVM class ownership and method paths
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for name in main_stage19_destructor_order main_stage19_initialization_order main_stage19_raii_guard main_stage19_playground_message main_stage20_parser main_stage20_displayable main_stage20_method_ownership main_stage20_static_constructor main_stage20_self main_stage20b_const_string_defaults main_stage21_conditional_constructor; do
            cargo run -p doriac --features llvm-backend -- compile "examples/native/${name}.doria" --release --out "build/native/${name}_release"
            valgrind --leak-check=full --show-leak-kinds=all --errors-for-leak-kinds=definite,indirect --track-origins=yes --error-exitcode=1 "build/native/${name}_release"
          done

      - name: Leak-check Stage 23a reordered owned arguments with LLVM
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo run -p doriac --features llvm-backend -- compile examples/native/main_stage23a_named_owned_arguments.doria --release --out build/native/main_stage23a_named_owned_arguments_release
          valgrind --leak-check=full --show-leak-kinds=all --errors-for-leak-kinds=definite,indirect --track-origins=yes --error-exitcode=1 build/native/main_stage23a_named_owned_arguments_release

      - name: Leak-check Stage 23c string sequence fills with LLVM
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo run -p doriac --features llvm-backend -- compile examples/native/main_stage23c_sequence_fill.doria --release --out build/native/main_stage23c_sequence_fill_release
          valgrind --leak-check=full --show-leak-kinds=all --errors-for-leak-kinds=definite,indirect --track-origins=yes --error-exitcode=1 build/native/main_stage23c_sequence_fill_release

      - name: Leak-check Stage 24 generic specialization with LLVM
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo run -p doriac --features llvm-backend -- compile examples/native/main_stage24_generic_first.doria --release --out build/native/main_stage24_generic_first_release
          valgrind --leak-check=full --show-leak-kinds=all --errors-for-leak-kinds=definite,indirect --track-origins=yes --error-exitcode=1 build/native/main_stage24_generic_first_release

      - name: Leak-check Stage 25 generic classes with LLVM
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo run -p doriac --features llvm-backend -- compile examples/native/main_stage25_generic_classes.doria --release --out build/native/main_stage25_generic_classes_release
          valgrind --leak-check=full --show-leak-kinds=all --errors-for-leak-kinds=definite,indirect --track-origins=yes --error-exitcode=1 build/native/main_stage25_generic_classes_release

      - name: Leak-check Stage 25a readonly shared ownership with LLVM
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo run -p doriac --features llvm-backend -- compile examples/native/main_stage25a_readonly_shared_ownership.doria --release --out build/native/main_stage25a_readonly_shared_ownership_release
          valgrind --leak-check=full --show-leak-kinds=all --errors-for-leak-kinds=definite,indirect --track-origins=yes --error-exitcode=1 build/native/main_stage25a_readonly_shared_ownership_release
          cargo run -p doriac --features llvm-backend -- compile examples/native/main_stage25a_shared_coalesce_ownership.doria --release --out build/native/main_stage25a_shared_coalesce_ownership_release
          valgrind --leak-check=full --show-leak-kinds=all --errors-for-leak-kinds=definite,indirect --track-origins=yes --error-exitcode=1 build/native/main_stage25a_shared_coalesce_ownership_release
          cargo run -p doriac --features llvm-backend -- compile examples/native/main_stage25a_referenced_value_collision.doria --release --out build/native/main_stage25a_referenced_value_collision_release
          valgrind --leak-check=full --show-leak-kinds=all --errors-for-leak-kinds=definite,indirect --track-origins=yes --error-exitcode=1 build/native/main_stage25a_referenced_value_collision_release

      - name: Leak-check Stage 25a writable shared ownership with LLVM
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for name in main_stage25a_writable_shared_class main_stage25a_writable_shared_collection main_stage25a_writable_shared_domains main_stage25a_writable_weak_reference main_stage25a_weak_cycle main_stage25a_shared_stress main_stage25a_access_lifetime main_stage25a_stored_access; do
            cargo run -p doriac --features llvm-backend -- compile "examples/native/${name}.doria" --release --out "build/native/${name}_release"
            valgrind --leak-check=full --show-leak-kinds=all --errors-for-leak-kinds=definite,indirect --track-origins=yes --error-exitcode=1 "build/native/${name}_release"
          done

      - name: Leak-check Stage 26a grouped string locals with LLVM
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo run -p doriac --features llvm-backend -- compile examples/native/main_stage26a_grouped_locals.doria --release --out build/native/main_stage26a_grouped_locals_release
          valgrind --leak-check=full --show-leak-kinds=all --errors-for-leak-kinds=definite,indirect --track-origins=yes --error-exitcode=1 build/native/main_stage26a_grouped_locals_release

      - name: Smoke LLVM release profile and panic parity on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cargo run -p doriac --features llvm-backend -- compile examples/native/main_release_profile_42.doria --release --out build/native/main_release_profile_42
          cargo run -p doriac --features llvm-backend -- compile examples/native/main_add_overflow_panic.doria --release --out build/native/main_add_overflow_panic
          cargo run -p doriac --features llvm-backend -- compile examples/native/main_float_to_int_nan_panic.doria --release --out build/native/main_float_to_int_nan_panic
          set +e
          build/native/main_release_profile_42
          release_status=$?
          build/native/main_add_overflow_panic 2>build/native/main_add_overflow_panic.stderr
          integer_panic_status=$?
          build/native/main_float_to_int_nan_panic 2>build/native/main_float_to_int_nan_panic.stderr
          float_panic_status=$?
          set -e
          test "${release_status}" -eq 42
          test "${integer_panic_status}" -eq 101
          test "${float_panic_status}" -eq 101
          grep -Fx "Panic[P1101]: Integer Addition Overflowed" build/native/main_add_overflow_panic.stderr
          grep -Fx "Call Path" build/native/main_add_overflow_panic.stderr
          grep -Fx "Panic[P1110]: Float To Integer Conversion Is Out Of Range" build/native/main_float_to_int_nan_panic.stderr
          grep -Fx "Call Path" build/native/main_float_to_int_nan_panic.stderr

      - name: Smoke LLVM release profile and panic parity on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo run -p doriac --features llvm-backend -- compile examples/native/main_release_profile_42.doria --release --out build/native/main_release_profile_42.exe
          cargo run -p doriac --features llvm-backend -- compile examples/native/main_add_overflow_panic.doria --release --out build/native/main_add_overflow_panic.exe
          cargo run -p doriac --features llvm-backend -- compile examples/native/main_float_to_int_nan_panic.doria --release --out build/native/main_float_to_int_nan_panic.exe
          function Invoke-DoriaFixture {
            param(
              [string] $Path,
              [int] $ExpectedStatus,
              [string] $StderrPath = ""
            )
            $start = @{
              FilePath = (Resolve-Path $Path).Path
              NoNewWindow = $true
              PassThru = $true
              Wait = $true
            }
            if ($StderrPath) {
              $start.RedirectStandardError = [IO.Path]::GetFullPath($StderrPath)
            }
            $process = Start-Process @start
            Write-Host "$Path exited with $($process.ExitCode)"
            if ($process.ExitCode -ne $ExpectedStatus) {
              throw "$Path status was $($process.ExitCode), expected $ExpectedStatus"
            }
          }
          Invoke-DoriaFixture build/native/main_release_profile_42.exe 42
          Invoke-DoriaFixture build/native/main_add_overflow_panic.exe 101 build/native/main_add_overflow_panic.stderr
          Invoke-DoriaFixture build/native/main_float_to_int_nan_panic.exe 101 build/native/main_float_to_int_nan_panic.stderr
          if (-not (Select-String -Path build/native/main_add_overflow_panic.stderr -SimpleMatch "Panic[P1101]: Integer Addition Overflowed")) { throw "missing integer panic" }
          if (-not (Select-String -Path build/native/main_add_overflow_panic.stderr -SimpleMatch "Call Path")) { throw "missing integer call path" }
          if (-not (Select-String -Path build/native/main_float_to_int_nan_panic.stderr -SimpleMatch "Panic[P1110]: Float To Integer Conversion Is Out Of Range")) { throw "missing float panic" }
          if (-not (Select-String -Path build/native/main_float_to_int_nan_panic.stderr -SimpleMatch "Call Path")) { throw "missing float call path" }
