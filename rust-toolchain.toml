# The exact compiler for every local vet and every CI job. Each CI job
# installs this file's toolchain with `rustup toolchain install` and no
# toolchain argument, so local and CI builds cannot drift apart when a new
# stable Rust is released. Moving to a newer Rust is a deliberate change to
# this line, verified like any other. scripts/check_rust_toolchain_authority.php
# enforces this.
[toolchain]
channel = "1.98.1"
components = ["rustfmt", "clippy"]
